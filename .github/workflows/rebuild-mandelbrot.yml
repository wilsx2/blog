name: Rebuild Mandelbrot Post

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA of wilsx2/wacfrac to pull'
        required: false
        default: 'main'

permissions:
  contents: write
  actions: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xu-cheng/texlive-full:latest
    steps:
      - name: Checkout blog
        uses: actions/checkout@v4

      - name: Checkout mandelbrot
        uses: actions/checkout@v4
        with:
          repository: wilsx2/wacfrac
          ref: ${{ inputs.ref }}
          path: mandelbrot

      - name: Step 1 - pull sources from mandelbrot
        working-directory: ${{ github.workspace }}
        run: ./scripts/pull-mandelbrot.sh mandelbrot

      - name: Step 2 - build mathjax posts
        working-directory: ${{ github.workspace }}
        run: ./scripts/build-mathjax-posts.sh

      - name: Commit and push if changed
        id: push
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "pwd=$(pwd)"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "toplevel=$(git rev-parse --show-toplevel 2>&1)"
          echo "gitdir=$(git rev-parse --git-dir 2>&1)"
          if git diff --quiet -- _posts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to _posts; skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add _posts
          git commit -m "Rebuild mathjax posts from mandelbrot@${{ inputs.ref }}"
          git push origin HEAD:master
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN does not fire on:push workflows, so
      # dispatch the Pages deploy explicitly (workflow_dispatch is exempt).
      - name: Trigger Pages deploy
        if: steps.push.outputs.changed == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"master"}'
